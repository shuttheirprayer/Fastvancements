[[mods]]
modId = "fastvancements"
version = "1.3"
displayName = "Fastvancements"
authors = "Misanthropy, bigenergy, txni, Mephodio"
description = '''
Fastvancements is a zero-dependency performance mod that aggressively rewrites Minecraft's advancement engine.

Features:
- O(1) Reverse Indexing: Eliminates brute-force inventory scanning.
- Efficient Tick Skipping: Throttles position and environment checking per player.
- Zero Library Bloat: Pure, native performance without heavy framework wrappers.
'''

