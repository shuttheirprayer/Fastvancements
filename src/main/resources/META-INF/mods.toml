modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
Fastvancements is a zero-dependency performance mod that aggressively rewrites Minecraft's advancement engine.

Features:
- O(1) Reverse Indexing: Eliminates brute-force inventory scanning.
- Efficient Tick Skipping: Throttles position and environment checking per player.
- Zero Library Bloat: Pure, native performance without heavy framework wrappers.
'''

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"